keys:
  - &jaxxen age1fido2-
  - &jaxxen2 age1fido2-
  - &jaxxen3 age1fido2-
  - &iridium 
creation_rules:
  - path_regex: secrets/iridium.yaml
    key_groups:
      - age:
        - *jaxxen
        - *jaxxen2
        - *jaxxen3
  - path_regex: secrets/fido.yaml
    key_groups:
      - age:
        - *jaxxen
        - *jaxxen2
        - *jaxxen3
        - *iridium
  - path_regex: secrets/mullvad.yaml
    key_groups:
      - age:
        - *jaxxen
        - *jaxxen2
        - *jaxxen3
        - *iridium
